<ion-content class="login-content">
  <div class="login-container">

    <div class="header">
      <img src="assets/logo.png" alt="Logo" class="logo" />
      <h1>Bienvenido</h1>
      <p>Ingresá tus credenciales para continuar</p>
    </div>

    <div class="form-card">
      <ion-item lines="none" class="input-item">
        <ion-label position="floating">Correo electrónico</ion-label>
        <ion-input
          type="email"
          [(ngModel)]="email"
          placeholder="ejemplo@correo.com">
        </ion-input>
      </ion-item>
      <p class="error-msg" *ngIf="errores.email">{{ errores.email }}</p>

      <ion-item lines="none" class="input-item">
        <ion-label position="floating">Contraseña</ion-label>
        <ion-input
          type="password"
          [(ngModel)]="password"
          placeholder="••••••••">
        </ion-input>
      </ion-item>
      <p class="error-msg" *ngIf="errores.password">{{ errores.password }}</p>

      <p class="error-msg error-general" *ngIf="errorGeneral">{{ errorGeneral }}</p>

      <ion-button expand="block" class="btn-ingresar" (click)="login()">
        Ingresar
      </ion-button>
    </div>

    <div class="acceso-rapido">
      <p class="acceso-titulo">Acceso rápido</p>
      <div class="botones-rapidos">
        <ion-button fill="outline" (click)="loginRapido('dueño')">Dueño</ion-button>
        <ion-button fill="outline" (click)="loginRapido('supervisor')">Supervisor</ion-button>
        <ion-button fill="outline" (click)="loginRapido('metre')">Metre</ion-button>
        <ion-button fill="outline" (click)="loginRapido('mozo')">Mozo</ion-button>
        <ion-button fill="outline" (click)="loginRapido('cocinero')">Cocinero</ion-button>
        <ion-button fill="outline" (click)="loginRapido('cantinero')">Cantinero</ion-button>
        <ion-button fill="outline" (click)="loginRapido('cliente')">Cliente</ion-button>
      </div>
    </div>

    <div class="ion-text-center ion-margin-top">
      <ion-button fill="clear" routerLink="/cliente/registro">
        ¿No tenés cuenta? Registrate
      </ion-button>
    </div>

  </div>
</ion-content>
