<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dueno"></ion-back-button>
    </ion-buttons>
    <ion-title>QR de Propinas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding ion-text-center">

  <p>Mostrá este QR al cliente para que seleccione el nivel de propina.</p>

  <ion-list lines="none" class="ion-margin-bottom">
    <ion-item>
      <ion-icon name="star-outline" slot="start" color="warning"></ion-icon>
      <ion-label>Excelente → 20%</ion-label>
    </ion-item>
    <ion-item>
      <ion-icon name="star-outline" slot="start" color="warning"></ion-icon>
      <ion-label>Muy bueno → 15%</ion-label>
    </ion-item>
    <ion-item>
      <ion-icon name="star-outline" slot="start" color="warning"></ion-icon>
      <ion-label>Bueno → 10%</ion-label>
    </ion-item>
    <ion-item>
      <ion-icon name="star-outline" slot="start" color="warning"></ion-icon>
      <ion-label>Regular → 5%</ion-label>
    </ion-item>
    <ion-item>
      <ion-icon name="star-outline" slot="start" color="warning"></ion-icon>
      <ion-label>Malo → 0%</ion-label>
    </ion-item>
  </ion-list>

  <div class="qr-wrapper">
    <img [src]="qrPropinas" alt="QR Propinas" *ngIf="qrPropinas" />
    <ion-spinner *ngIf="!qrPropinas" name="crescent"></ion-spinner>
  </div>

  <ion-button expand="block" (click)="descargar()" *ngIf="qrPropinas" class="ion-margin-top">
    <ion-icon name="download-outline" slot="start"></ion-icon>
    Descargar QR
  </ion-button>

</ion-content>
