<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
    <ion-title>Ingreso Anónimo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding ion-text-center">

   <!-- Tomar foto -->
  <div class="foto-container" (click)="tomarFoto()">
      @if (foto) {
        <img [src]="foto" class="foto-preview" />
      } @else {
        <ion-icon name="person-circle-outline" class="foto-placeholder"></ion-icon>
      }
      <div class="camara-overlay">
        <ion-icon name="camera-outline"></ion-icon>
      </div>
    </div>

    @if (errorFoto) {
      <ion-text color="danger">
        <small>{{ errorFoto }}</small>
      </ion-text>
    }

  <ion-item lines="none" class="ion-margin-top">
      <ion-label position="floating">Nombre *</ion-label>
      <ion-input [(ngModel)]="nombre" type="text"></ion-input>
    </ion-item>
    @if (errorNombre) {
      <ion-text color="danger">
        <small>{{ errorNombre }}</small>
      </ion-text>
    }

    @if (errorGeneral) {
      <ion-text color="danger">
        <p>{{ errorGeneral }}</p>
      </ion-text>
    }


  <ion-button expand="block" (click)="ingresar()" [disabled]="cargando" class="ion-margin-top">
    @if (cargando) {
      <ion-spinner name="crescent"></ion-spinner>
    } @else {
      Ingresar
    }
  </ion-button>

</ion-content>
