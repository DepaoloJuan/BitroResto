<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
    <ion-title>Ingreso Anónimo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding ion-text-center">

  <ion-icon name="person-outline" size="large"></ion-icon>
  <h2>Ingresá tu nombre</h2>
  <p>No necesitás registrarte para entrar al local.</p>

  <ion-item lines="none" class="ion-margin-top">
    <ion-label position="floating">Nombre *</ion-label>
    <ion-input [(ngModel)]="nombre" type="text"></ion-input>
  </ion-item>
  <ion-text color="danger" *ngIf="errorNombre">
    <small>{{ errorNombre }}</small>
  </ion-text>

  <!-- Foto temporal -->
  <ion-item lines="none" class="ion-margin-top">
    <ion-label position="floating">URL de foto (temporal)</ion-label>
    <ion-input [(ngModel)]="foto" type="url"></ion-input>
  </ion-item>

  <ion-text color="danger" *ngIf="errorGeneral">
    <p>{{ errorGeneral }}</p>
  </ion-text>

  <ion-button expand="block" (click)="ingresar()" [disabled]="cargando" class="ion-margin-top">
    @if (cargando) {
      <ion-spinner name="crescent"></ion-spinner>
    } @else {
      Ingresar
    }
  </ion-button>

</ion-content>
