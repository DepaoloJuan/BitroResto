<ion-content class="home-content" [scrollY]="false">
  <div class="home-container">

    <div class="home-greeting">
      <div class="greeting-text">
        <p class="bienvenida">Bienvenido,</p>
        <h1 class="nombre">{{ usuario()?.nombre ?? 'Cliente' }}</h1>
      </div>
      <ion-button fill="clear" class="btn-logout" (click)="cerrarSesion()">
        <ion-icon name="log-out-outline"></ion-icon>
      </ion-button>
    </div>

    <div class="home-grid metre-grid">
      <div class="menu-card" (click)="ir('/cliente/lista-espera')">
        <ion-icon name="time-outline"></ion-icon>
        <p class="card-titulo">Lista de espera</p>
        <p class="card-desc">Anotate para conseguir una mesa</p>
      </div>
    </div>

  </div>
</ion-content>
