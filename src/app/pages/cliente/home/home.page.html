<ion-header>
  <ion-toolbar>
    <ion-title>Hola, {{ usuario()?.nombre }}!</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrarSesion()">
        <ion-icon name="log-out-outline"></ion-icon>
        Cerrar sesión
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card button (click)="ir('/cliente/lista-espera')">
    <ion-card-content class="ion-text-center ion-padding">
      <ion-icon name="time-outline" size="large"></ion-icon>
      <p>Anotarme en lista de espera</p>
    </ion-card-content>
  </ion-card>
</ion-content>
