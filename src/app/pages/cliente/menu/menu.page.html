<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/cliente/mesa"></ion-back-button>
    </ion-buttons>
    <ion-title>Menú</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-segment [(ngModel)]="seccion" (ionChange)="cambiarSeccion()">
    <ion-segment-button value="platos">
      <ion-label>Platos</ion-label>
    </ion-segment-button>
    <ion-segment-button value="bebidas">
      <ion-label>Bebidas</ion-label>
    </ion-segment-button>
  </ion-segment>

  @if (cargando) {
    <app-loading />
  }

  @for (item of items; track item.id) {
    <ion-card class="ion-margin">
      <div class="fotos-container">
        <div class="fotos-scroll">
          @if (item.foto1) {
            <img [src]="item.foto1" alt="Foto 1" class="foto-item" />
          }
          @if (item.foto2) {
            <img [src]="item.foto2" alt="Foto 2" class="foto-item" />
          }
          @if (item.foto3) {
            <img [src]="item.foto3" alt="Foto 3" class="foto-item" />
          }
        </div>
      </div>
      <ion-card-header>
        <ion-card-title>{{ item.nombre }}</ion-card-title>
        <ion-card-subtitle>
          ${{ item.precio }} — {{ item.tiempo_elaboracion }} min.
        </ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <p>{{ item.descripcion }}</p>
      </ion-card-content>
    </ion-card>
  }

</ion-content>
