<ion-content class="home-content" [scrollY]="false">
  <div class="home-container">

    <div class="home-greeting">
      <div class="greeting-text">
        <p class="bienvenida">Bienvenido,</p>
        <h1 class="nombre">{{ usuario()?.nombre }}</h1>
      </div>
      <ion-button fill="clear" class="btn-logout" (click)="cerrarSesion()">
        <ion-icon name="log-out-outline"></ion-icon>
      </ion-button>
    </div>

    <div class="home-grid dos-grid">
      <div class="menu-card" (click)="ir('/cantinero/agregar-bebida')">
        <ion-icon name="wine-outline"></ion-icon>
        <p class="card-titulo">Agregar bebida</p>
        <p class="card-desc">Sumá bebidas al menú</p>
      </div>
      <div class="menu-card" (click)="ir('/cantinero/pedidos')">
        <ion-icon name="list-outline"></ion-icon>
        <p class="card-titulo">Pedidos pendientes</p>
        <p class="card-desc">Lo que hay que preparar</p>
      </div>
    </div>

  </div>
</ion-content>
