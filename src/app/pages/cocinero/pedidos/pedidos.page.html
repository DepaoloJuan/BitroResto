<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/cocinero"></ion-back-button>
    </ion-buttons>
    <ion-title>Pedidos - Cocina</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div *ngIf="cargando" class="ion-text-center ion-padding">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <div *ngIf="!cargando && pedidos.length === 0" class="ion-text-center ion-padding">
    <ion-icon name="restaurant-outline" size="large"></ion-icon>
    <p>No hay pedidos pendientes en cocina.</p>
  </div>

  <ion-card *ngFor="let pedido of pedidos" class="ion-margin-top">
    <ion-card-header>
      <ion-card-title>Mesa {{ pedido.mesas?.numero }}</ion-card-title>
      <ion-card-subtitle>{{ pedido.fecha_creacion | date:'dd/MM/yyyy HH:mm' }}</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <ion-item *ngFor="let item of pedido.items_filtrados" lines="none">
        <ion-icon name="restaurant-outline" slot="start"></ion-icon>
        <ion-label>{{ item.nombre }}</ion-label>
        <ion-badge slot="end" color="primary">x{{ item.cantidad }}</ion-badge>
      </ion-item>

      <ion-button expand="block" color="success" class="ion-margin-top"
        (click)="marcarListo(pedido)" [disabled]="pedido._enviando">
        <ion-spinner *ngIf="pedido._enviando" name="crescent"></ion-spinner>
        <ion-icon *ngIf="!pedido._enviando" name="checkmark-done-outline" slot="start"></ion-icon>
        <span *ngIf="!pedido._enviando">Listo para entregar</span>
      </ion-button>

      <ion-text color="success" *ngIf="pedido._exito">
        <small>{{ pedido._exito }}</small>
      </ion-text>
      <ion-text color="danger" *ngIf="pedido._error">
        <small>{{ pedido._error }}</small>
      </ion-text>
    </ion-card-content>
  </ion-card>

</ion-content>
