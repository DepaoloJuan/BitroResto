<ion-header>
  <ion-toolbar>
    <ion-title>Hola, {{ usuario?.nombre }}!</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrarSesion()">
        <ion-icon name="log-out-outline"></ion-icon>
        Cerrar sesión
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size="12">
        <ion-card button (click)="ir('/metre/lista-espera')">
          <ion-card-content>
            <ion-icon name="people-outline"></ion-icon>
            <p>Lista de espera</p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
