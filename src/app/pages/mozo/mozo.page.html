<ion-content class="home-content" [scrollY]="false">
  <div class="home-container">

    <div class="home-greeting">
      <div class="greeting-text">
        <p class="bienvenida">Bienvenido,</p>
        <h1 class="nombre">{{ usuario()?.nombre }}</h1>
      </div>
      <ion-button fill="clear" class="btn-logout" (click)="cerrarSesion()">
        <ion-icon name="log-out-outline"></ion-icon>
      </ion-button>
    </div>

    <div class="home-grid dos-grid">
      <div class="menu-card" (click)="ir('/mozo/pedidos')">
        <ion-icon name="receipt-outline"></ion-icon>
        <p class="card-titulo">Pedidos pendientes</p>
        <p class="card-desc">Atendé las mesas</p>
      </div>
      <div class="menu-card" (click)="ir('/mozo/chat')">
        <ion-icon name="chatbubbles-outline"></ion-icon>
        <p class="card-titulo">Consultas de clientes</p>
        <p class="card-desc">Respondé preguntas</p>
      </div>
    </div>

  </div>
</ion-content>
